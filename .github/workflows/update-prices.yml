name: Update card prices and official news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python tools/update_prices.py
      - run: python tools/update_news.py
      - name: Commit updated data
        run: |
          git config user.name 'nichirin-price-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prices.json data/price-history.json data/news.json
          git diff --cached --quiet || git commit -m 'Update card prices and official news'
          git push
