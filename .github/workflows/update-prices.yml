name: Update card prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update prices and per-shop daily history
        env:
          MERCARI_AUTHORIZED_API_URL: ${{ secrets.MERCARI_AUTHORIZED_API_URL }}
          MERCARI_AUTHORIZED_API_TOKEN: ${{ secrets.MERCARI_AUTHORIZED_API_TOKEN }}
          MERCARI_API_LIMIT: '20'
        run: python tools/update_prices.py
      - name: Upload price audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-audit
          path: data/price_audit.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Update official news
        run: python tools/update_news.py
      - name: Commit updated data
        run: |
          git config user.name 'nichirin-price-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prices.json data/news.json
          git diff --cached --quiet || git commit -m 'Update card prices, shop history and official news'
          git push
